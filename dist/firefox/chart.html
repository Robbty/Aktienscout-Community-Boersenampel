<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Kurs-Chart</title>
  <link rel="stylesheet" href="chart.css" />
</head>
<body>
  <header>
    <div class="head-left">
      <h1 id="chartName"></h1>
      <div id="chartMeta" class="meta"></div>
    </div>
    <div class="head-right">
      <div class="ranges" id="ranges">
        <button type="button" data-range="kauf">Seit Kauf</button>
        <button type="button" data-range="12h">12h</button>
        <button type="button" data-range="tage">Tage</button>
        <button type="button" data-range="wochen">Wochen</button>
        <button type="button" data-range="1mo">1M</button>
        <button type="button" data-range="3mo">3M</button>
      </div>
      <!-- Anzeigewährung: nur sichtbar, wenn die Börse nicht in Euro notiert
           und ein FX-Kurs vorliegt. Standard: Euro. -->
      <div class="ranges cur" id="curToggle" hidden title="Anzeigewährung – € wird mit dem AKTUELLEN Wechselkurs umgerechnet, nicht mit historischen Kursen">
        <button type="button" data-cur="eur">€</button>
        <button type="button" data-cur="native">USD</button>
      </div>
    </div>
  </header>
  <div class="canvas-wrap"><canvas id="chart"></canvas></div>
  <!-- Brush: Mini-Übersicht mit frei ziehbarem Auswahlbereich (zwei Griffe). -->
  <div id="brush" class="brush" title="Bereich wählen: Griffe ziehen, Auswahl verschieben">
    <canvas id="brushCanvas"></canvas>
    <div id="brushSel" class="brush-sel">
      <div class="brush-handle left"></div>
      <div class="brush-handle right"></div>
    </div>
  </div>
  <footer id="chartLegend" class="legend"></footer>
  <script src="lib/quotes.js"></script>
  <script src="chart.js"></script>
</body>
</html>
